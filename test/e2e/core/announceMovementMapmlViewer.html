<!DOCTYPE html>
<html lang="en">

<head>
  <title>Announce movement (OSMTILE)</title>
  <meta charset="UTF-8">
  <script>
    let options = document.createElement("map-options");
    options.innerHTML = '{"announceMovement":true}';
    document.head.appendChild(options);
  </script>
  <script type="module" src="mapml.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <!-- The OSMTILE counterpart of ../mapml-viewer/mapml-viewer.html, for
       announceMovement.test.js. Like upstream's CBMTILE layer, the inline
       extent covers a region smaller than the view at the map's minimum zoom
       (2: at 0 or 1 the world is narrower than the map). It is 10 tiles wide at
       zoom 5, i.e. 320px at zoom 2, and the map is 600px wide, so after the
       spec's two ArrowLeft presses the view still overlaps the region at zoom 2
       and 3, and four more always leave its west edge, for any keyboard pan
       step from 80px (Leaflet) to 128px; and once bounced back, zooming in
       leaves it. -->
  <mapml-viewer data-testid="testviewer" style="height: 600px;width:600px;" projection="OSMTILE" zoom="2" lat="41" lon="-90" controls>
    <map-layer data-testid="testlayer" label="OSMTILE - INLINE" checked>
      <map-extent units="OSMTILE" checked hidden>
        <map-input name="z" type="zoom" value="5" min="2" max="5"></map-input>
        <map-input name="y" type="location" axis="row" units="tilematrix" min="8" max="15"></map-input>
        <map-input name="x" type="location" axis="column" units="tilematrix" min="3" max="12"></map-input>
        <map-link rel="tile" tref="/data/osmtile/{z}/{x}/{y}.png"></map-link>
      </map-extent>
    </map-layer>
  </mapml-viewer>
</body>

</html>
